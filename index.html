<!-- 1) Must run before any other script.
When a user clicks the "reset password" link in their email, they land on the site with
a temporary token in the address (…#access_token=…&type=recovery).
Here we save a small marker and send the user to the private /reset-password page,
before the Supabase library reads the token and removes it from the address. -->
<script>
(function(){
  var h=location.hash||'',q=location.search||'';
  try{
    if(/[#&?]type=recovery/.test(h)||/[?&]type=recovery/.test(q)){
      sessionStorage.setItem('dl_recovery','1');
      sessionStorage.removeItem('dl_recovery_error');
      if(location.pathname.replace(/\/+$/,'')!=='/reset-password')history.replaceState(null,'','/reset-password'+q+h);
    }else if(/error_code=(otp_expired|access_denied)/.test(h+q)&&/error/.test(h+q)){
      sessionStorage.setItem('dl_recovery_error','1');
      if(location.pathname.replace(/\/+$/,'')!=='/reset-password')history.replaceState(null,'','/reset-password');
    }
  }catch(e){}
})();
</script>
